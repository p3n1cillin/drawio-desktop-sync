name: ShareMap Windows build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'electron-builder-sharemap.json'
      - '.github/workflows/sharemap.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run test:shared-ui
      - run: npm run build:sharemap
      - uses: actions/upload-artifact@v6
        with:
          name: ShareMap-Desktop-Windows-x64
          path: dist/sharemap/*.zip
