name: drawio-desktop-sync Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'sync.cjs'
      - 'electron-builder-sync.json'
      - 'build/sync-installer.nsh'
      - 'build/test-sync-installer.ps1'
      - '.github/workflows/sync.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Use a canonical temporary directory
        shell: pwsh
        run: |
          "TEMP=${{ runner.temp }}" >> $env:GITHUB_ENV
          "TMP=${{ runner.temp }}" >> $env:GITHUB_ENV
      - run: npm test
      - run: npm run test:shared-ui
      - run: npm run test:server-ui
      - run: npm run build:sync
      - name: Verify installer and file associations
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist/sync/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer' }
          ./build/test-sync-installer.ps1 -Installer $installers[0].FullName
      - uses: actions/upload-artifact@v6
        with:
          name: drawio-desktop-sync-Windows-x64
          path: |
            dist/sync/*-setup.exe
            dist/sync/*.zip
            dist/sync/*.yml
            dist/sync/*.blockmap

  publish:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'p3n1cillin/drawio-desktop-sync'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: drawio-desktop-sync-Windows-x64
          path: release
      - name: Publish tested installer and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false --prerelease=false --latest
